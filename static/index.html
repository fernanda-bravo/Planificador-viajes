<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Viaje a la Playa 🍄</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700&family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        :root {
            --bg-color: #FDF2F8; 
            --card-bg: #FFFFFF;
            --primary: #F472B6; 
            --shadow-color: #FBCFE8; 
            --text-dark: #4B5563;
            --success: #34D399;
            --danger: #F87171;
        }
        
        body { 
            font-family: 'Nunito', sans-serif; 
            background-color: var(--bg-color);
            background-image: radial-gradient(var(--shadow-color) 2px, transparent 2px);
            background-size: 20px 20px;
            color: var(--text-dark); 
            margin: 0; 
            padding: 20px; 
            text-align: center; 
        }
        
        h1 { font-family: 'Press Start 2P', cursive; font-size: 1.5rem; color: var(--primary); margin-bottom: 10px; line-height: 1.5; text-shadow: 2px 2px 0px var(--shadow-color); }
        .container { max-width: 800px; margin: 0 auto; }
        
        .user-profile { text-align: right; margin-bottom: 20px; font-weight: bold; color: var(--primary); font-family: 'Press Start 2P', cursive; font-size: 0.7rem; }
        
        /* Banner de Fase (Misión actual) */
        .phase-banner {
            background-color: var(--primary);
            color: white;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 25px;
            font-family: 'Press Start 2P', cursive;
            font-size: 0.8rem;
            border: 3px solid #DB2777;
            box-shadow: 6px 6px 0px var(--shadow-color);
            line-height: 1.5;
            transition: all 0.5s ease;
        }
        .phase-banner-success {
            background-color: #059669; /* Verde éxito */
            border-color: #047857;
            box-shadow: 6px 6px 0px #A7F3D0;
        }

        .btn-small, .btn-add, .btn-link { 
            font-family: 'Press Start 2P', cursive;
            font-size: 0.6rem;
            background: var(--primary); 
            color: white; 
            border: 2px solid #DB2777; 
            padding: 10px; 
            border-radius: 5px; 
            cursor: pointer; 
            box-shadow: 2px 2px 0px #DB2777;
            text-decoration: none;
        }
        .btn-small:active, .btn-add:active, .btn-link:active {
            box-shadow: 0px 0px 0px #DB2777;
            transform: translateY(2px) translateX(2px);
        }

        .form-box { 
            background: var(--card-bg); 
            padding: 20px; 
            border-radius: 8px; 
            border: 3px solid var(--primary);
            box-shadow: 6px 6px 0px var(--shadow-color); 
            margin-bottom: 30px; 
        }
        
        input, select { 
            padding: 10px; 
            margin: 5px; 
            border-radius: 5px; 
            border: 2px solid var(--shadow-color); 
            font-family: 'Nunito', sans-serif; 
            font-weight: bold;
        }
        
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 25px; }
        
        .card { 
            background: var(--card-bg); 
            border-radius: 8px; 
            overflow: hidden; 
            border: 3px solid var(--primary);
            box-shadow: 6px 6px 0px var(--shadow-color); 
            transition: transform 0.2s, box-shadow 0.2s; 
            position: relative;
        }
        /* Resaltar la tarjeta ganadora */
        .card.winner {
            border-color: #059669;
            box-shadow: 6px 6px 0px #A7F3D0;
        }

        /* Pines del mapa pixelados */
        .map-emoji-marker {
            font-size: 18px;
            background: white;
            border: 2px solid var(--primary);
            border-radius: 50%;
            box-shadow: 2px 2px 0px var(--shadow-color);
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1;
        }
        .winner-marker { border-color: #059669; box-shadow: 2px 2px 0px #A7F3D0; }
        
        .card:hover { transform: translateY(-4px) translateX(-2px); box-shadow: 8px 8px 0px var(--shadow-color); }
        .card img { width: 100%; height: 150px; object-fit: cover; border-bottom: 3px solid var(--primary); }
        .card.winner img { border-bottom-color: #059669; }
        
        .card-content { padding: 15px; }
        .card-title { font-weight: bold; font-size: 1.1rem; margin-bottom: 5px; }
        .card-price { color: var(--primary); font-size: 0.8rem; font-family: 'Press Start 2P', cursive; margin-bottom: 10px; line-height: 1.4;}
        
        .vote-buttons { display: flex; justify-content: space-around; padding: 15px 10px; border-top: 3px dashed var(--shadow-color); background: #fdf8fa; }
        .btn-vote { border: 2px solid; border-radius: 8px; width: 50px; height: 50px; font-size: 1.5rem; cursor: pointer; box-shadow: 3px 3px 0px; transition: transform 0.1s; }
        .btn-yes { background-color: #D1FAE5; border-color: #059669; color: var(--success); box-shadow: 3px 3px 0px #059669; }
        .btn-no { background-color: #FEE2E2; border-color: #DC2626; color: var(--danger); box-shadow: 3px 3px 0px #DC2626; }
        .btn-vote:active { transform: translateY(3px) translateX(3px); box-shadow: 0px 0px 0px !important; }
        
        .status-badge { font-family: 'Press Start 2P', cursive; padding: 8px; border-radius: 5px; font-size: 0.6rem; border: 2px solid; display: inline-block; }
        .status-pending { background-color: #FEF3C7; border-color: #D97706; color: #D97706; }
        .status-approved { background-color: #D1FAE5; border-color: #059669; color: #059669; }
        .status-rejected { background-color: #FEE2E2; border-color: #DC2626; color: #DC2626; }

        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.6); }
        .modal-content { background-color: var(--card-bg); margin: 10% auto; padding: 20px; border-radius: 8px; width: 80%; max-width: 500px; text-align: left; position: relative; border: 4px solid var(--primary); box-shadow: 8px 8px 0px var(--shadow-color);}
        .close-btn { position: absolute; right: 15px; top: 10px; font-size: 1.2rem; cursor: pointer; border: none; background: none; font-family: 'Press Start 2P', cursive; color: var(--primary);}
        .modal-img { width: 100%; border-radius: 5px; margin-top: 10px; max-height: 250px; object-fit: cover; border: 2px solid var(--shadow-color);}
    </style>
</head>
<body>

<div class="container">
    <div class="user-profile" id="userProfile">
        <span id="welcomeText"></span>
        <button class="btn-small" style="margin-left: 10px;" onclick="cambiarUsuario()">Cambiar</button>
    </div>

    <h1>Viaje Familiar<br>🌸🍄</h1>
    
    <!-- NUEVO: Letrero de la misión actual -->
    <div id="phaseBanner" class="phase-banner">
        Cargando misión...
        <!-- El mapa empezará oculto -->
    </div>
    <!-- El mapa empezará oculto -->
    <div id="mapContainer" style="display: none; height: 350px; margin-bottom: 25px; border-radius: 8px; border: 3px solid var(--primary); box-shadow: 6px 6px 0px var(--shadow-color); z-index: 1;"></div>
    
    <div class="form-box">
        <h3 style="font-family: 'Press Start 2P', cursive; font-size: 0.8rem; color: var(--primary);">✨ Proponer Idea</h3>
        <select id="propCategory" style="width: 100%; margin-bottom: 10px;">
            <!-- Las opciones se llenarán solas por JavaScript dependiendo de la Fase -->
        </select>
        <input type="url" id="linkUrl" placeholder="Pega el link aquí..." style="width: 100%; box-sizing: border-box;">
        <input type="text" id="locationName" placeholder="Ubicación mapa (Ej: Maitencillo) - Opcional" style="width: 100%; box-sizing: border-box; font-size: 0.8rem; margin-bottom: 10px;">
        <button class="btn-add" style="width: 100%; margin-top: 10px;" onclick="agregarPropuesta()">Enviar al tablón</button>
    </div>

    <div class="grid" id="proposalsGrid"></div>
</div>

<div id="infoModal" class="modal">
    <div class="modal-content">
        <button class="close-btn" onclick="cerrarModal()">X</button>
        <h3 id="modalTitle" style="margin-top: 0; font-family: 'Press Start 2P', cursive; font-size: 0.9rem; color: var(--primary); line-height: 1.4;"></h3>
        <img id="modalImg" class="modal-img" src="">
        <p id="modalDesc" style="font-size: 0.95rem; line-height: 1.5;"></p>
        <a id="modalLink" href="" target="_blank" class="btn-link" style="display: block; text-align: center; margin-top: 15px;">Ver más info ✈️</a>
    </div>
</div>

<script>
    let currentUser = "";
    let mapaInteractivo = null; // Guarda el mapa
    let marcadoresMap = [];     // Guarda los pines

    function verificarUsuario() {
        currentUser = localStorage.getItem("viajeroName");
        if (!currentUser) {
            currentUser = prompt("¡Bienvenido! 🌸 Ingresa tu nombre:");
            if (!currentUser) currentUser = "Granjero Anónimo";
            localStorage.setItem("viajeroName", currentUser);
        }
        document.getElementById("welcomeText").innerText = `Hola, ${currentUser}`;
        cargarPropuestas();
    }

    function cambiarUsuario() {
        localStorage.removeItem("viajeroName");
        verificarUsuario();
    }

    async function cargarPropuestas() {
        const grid = document.getElementById('proposalsGrid');
        grid.innerHTML = '<p style="font-family: \'Press Start 2P\', cursive; font-size: 0.8rem; color: var(--primary);">Cargando tablón... 🍄</p>';
        
        const response = await fetch('/proposals');
        const proposals = await response.json();
        
        // --- NUEVA LÓGICA DE FASES ---
        
        // 1. ¿Ya tenemos un alojamiento ganador?
        const alojamientoGanador = proposals.find(p => p.category === '🏠 Alojamiento' && p.status === 'approved');
        
        const banner = document.getElementById('phaseBanner');
        const select = document.getElementById('propCategory');
        let propuestasAMostrar = [];

       if (!alojamientoGanador) {
            banner.innerText = '📍 Fase 1: ¡Necesitamos un lugar para dormir! Propón y vota por alojamientos.';
            banner.className = 'phase-banner';
            select.innerHTML = '<option value="🏠 Alojamiento">🏠 Alojamiento</option>';
            propuestasAMostrar = proposals.filter(p => p.category === '🏠 Alojamiento');
            document.getElementById('mapContainer').style.display = 'none'; // Ocultar mapa
        } else {
            banner.innerText = '🎉 ¡Lugar Elegido! Fase 2: ¿Qué comeremos y qué haremos?';
            banner.className = 'phase-banner phase-banner-success';
            select.innerHTML = '<option value="🎢 Panorama">🎢 Panorama</option><option value="🍔 Comida">🍔 Comida</option>';
            propuestasAMostrar = proposals.filter(p => p.id === alojamientoGanador.id || p.category !== '🏠 Alojamiento');
            
            // --- MOSTRAR EL MAPA EN FASE 2 ---
            document.getElementById('mapContainer').style.display = 'block';
            
            // Crear el mapa si no existe
            if (!mapaInteractivo) {
                mapaInteractivo = L.map('mapContainer').setView([0, 0], 13);
                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                    attribution: '© OpenStreetMap 🍄'
                }).addTo(mapaInteractivo);
            }

            // Limpiar pines antiguos
            marcadoresMap.forEach(m => mapaInteractivo.removeLayer(m));
            marcadoresMap = [];
            let coordenadasCargadas = [];

            // Dibujar los pines para los lugares que tengan lat/lon
            propuestasAMostrar.forEach(p => {
                if (p.lat && p.lon) {
                    const isWinner = p.id === alojamientoGanador.id;
                    const emojiCat = p.category.split(' ')[0]; // Extrae el emoji 🏠, 🍔, 🎢
                    
                    const iconoEstetico = L.divIcon({
                        html: emojiCat,
                        className: 'map-emoji-marker ' + (isWinner ? 'winner-marker' : ''),
                        iconSize: [30, 30],
                        iconAnchor: [15, 15]
                    });

                    const pin = L.marker([p.lat, p.lon], {icon: iconoEstetico}).addTo(mapaInteractivo);
                    pin.bindPopup(`<b>${p.title}</b><br>Ideado por: ${p.proposed_by_name}`);
                    marcadoresMap.push(pin);
                    coordenadasCargadas.push([p.lat, p.lon]);
                }
            });

           // Centrar el mapa automáticamente
            if (coordenadasCargadas.length > 0) {
                mapaInteractivo.fitBounds(coordenadasCargadas, {padding: [40, 40]});
            } else {
                // Si la casa ganó pero no tiene coordenadas (porque Airbnb nos bloqueó y olvidaron escribir la ubicación)
                // Centramos la vista hermosamente en Chile con un zoom alejado
                mapaInteractivo.setView([-33.45, -70.66], 5);
            }
        }

        // --- FIN LÓGICA DE FASES ---

        grid.innerHTML = '';
        propuestasAMostrar.forEach(prop => {
            const isApproved = prop.status === 'approved';
            const isRejected = prop.status === 'rejected';
            // Si es el alojamiento ganador, le ponemos una clase CSS especial
            const isWinnerCard = (prop.id === alojamientoGanador?.id);
            
            grid.innerHTML += `
                <div class="card ${isWinnerCard ? 'winner' : ''}" style="${isRejected ? 'opacity: 0.6; filter: grayscale(50%);' : ''}">
                    <img src="${prop.image_url || 'https://via.placeholder.com/250x150/FDF2F8/F472B6?text=Sin+Foto'}" alt="Foto">
                    <div class="card-content">
                        <div style="float: right;">
                            ${isWinnerCard ? `<span style="font-size: 1.2rem; margin-right: 5px;" title="Lugar Elegido">👑</span>` : ''}
                            <button onclick="borrarPropuesta(${prop.id})" style="background: none; border: none; font-size: 1.2rem; cursor: pointer; transform: translateY(-5px);" title="Borrar">🗑️</button>
                        </div>
                        
                        <div style="font-family: 'Press Start 2P', cursive; font-size: 0.6rem; color: var(--primary); margin-bottom: 8px;">${prop.category}</div>
                        <div class="card-title">${prop.title}</div>
                        <button class="btn-small" style="margin: 5px 0 10px 0; width: 100%; box-sizing: border-box;" onclick="abrirModal('${prop.title.replace(/'/g, "\\'")}', '${prop.image_url}', '${(prop.description || '').replace(/'/g, "\\'")}', '${prop.url}')">Detalles 🔍</button>
                        <div class="card-price">Idea de:<br>${prop.proposed_by_name}</div>
                        
                        <div style="margin-top: 15px;">
                            <span class="status-badge ${isApproved ? 'status-approved' : isRejected ? 'status-rejected' : 'status-pending'}">
                                ${isApproved ? '¡Aprobado! 🌟' : isRejected ? 'Descartado ❌' : 'En votación ⏳'}
                            </span>
                        </div>

                        <div style="margin-top: 15px; font-size: 0.85rem; background: #fdf8fa; padding: 10px; border-radius: 5px; border: 2px dashed var(--shadow-color);">
                            <div style="color: var(--success); margin-bottom: 5px;">
                                ⭐ A favor: <strong>${prop.yes_votes}</strong> / ${prop.required_votes}
                            </div>
                            <div style="color: var(--danger);">
                                ✖️ En contra: <strong>${prop.no_votes}</strong>
                            </div>
                        </div>
                    </div>
                    
                    ${(!isApproved && !isRejected) ? `
                    <div class="vote-buttons">
                        <button class="btn-vote btn-no" onclick="votar(${prop.id}, 'shipping_bin')" title="Descartar">✖️</button>
                        <button class="btn-vote btn-yes" onclick="votar(${prop.id}, 'stardrop')" title="¡Me encanta!">⭐</button>
                    </div>
                    ` : ''}
                </div>
            `;
        });
    }

    async function agregarPropuesta() {
        const url = document.getElementById('linkUrl').value;
        const category = document.getElementById('propCategory').value;
        
        // Lectura segura: si el cajón existe saca el valor, si no, lo deja en blanco
        const customImgEl = document.getElementById('customImgUrl');
        const customImg = customImgEl ? customImgEl.value : "";
        
        const locationEl = document.getElementById('locationName');
        const locationName = locationEl ? locationEl.value : ""; 
        
        if(!url) { alert('Falta el enlace 🌸'); return; }

        const btn = document.querySelector('.btn-add');
        btn.innerText = 'Buscando...';

        try {
            const response = await fetch('/proposals', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ 
                    user_name: currentUser, 
                    category: category, 
                    url: url,
                    image_url: customImg,
                    location_name: locationName
                })
            });

            if (!response.ok) {
                console.error("Error en el servidor:", await response.text());
                alert("Hubo un error al guardar. Revisa la terminal de VSCode.");
            }
        } catch (error) {
            console.error("Error de conexión:", error);
        }

        // Limpiamos los campos
        document.getElementById('linkUrl').value = '';
        if(customImgEl) customImgEl.value = '';
        if(locationEl) locationEl.value = '';
        btn.innerText = 'Enviar al tablón';
        
        cargarPropuestas();
    }

    async function votar(proposalId, tipoVoto) {
        const response = await fetch('/votes', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ proposal_id: proposalId, user_name: currentUser, vote_type: tipoVoto })
        });
        if(response.status === 400) alert("¡Ups! Ya votaste. 🍄");
        else cargarPropuestas();
    }

    async function borrarPropuesta(proposalId) {
        if (confirm("¿Borrar esta idea del tablón? 🗑️")) {
            await fetch(`/proposals/${proposalId}`, { method: 'DELETE' });
            cargarPropuestas();
        }
    }

    function abrirModal(title, img, desc, url) {
        document.getElementById('modalTitle').innerText = title;
        document.getElementById('modalImg').src = img || 'https://via.placeholder.com/250x150/FDF2F8/F472B6?text=Sin+Foto';
        document.getElementById('modalDesc').innerText = desc || "Sin detalles.";
        document.getElementById('modalLink').href = url;
        document.getElementById('infoModal').style.display = 'block';
    }
    function cerrarModal() { document.getElementById('infoModal').style.display = 'none'; }
    window.onclick = function(e) { if (e.target == document.getElementById('infoModal')) cerrarModal(); }

    verificarUsuario();
</script>
</body>
</html>
